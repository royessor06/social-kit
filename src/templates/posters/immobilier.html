<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .poster {
      width: 1080px;
      height: 1080px;
      padding: 76px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: #f8fafc;
      background: linear-gradient(145deg, #102b2b 0%, #163d3a 54%, #0f172a 100%);
      position: relative;
    }
    .poster::before {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      right: -210px;
      top: -190px;
      border: 2px solid rgba(216, 180, 122, .38);
      border-radius: 50%;
      box-shadow: 0 0 0 38px rgba(216, 180, 122, .06), 0 0 0 78px rgba(216, 180, 122, .04);
    }
    .top, .middle, .bottom { position: relative; z-index: 1; }
    .eyebrow {
      color: #e3c696;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    h1 { max-width: 820px; margin-top: 30px; font-size: 78px; line-height: 1.04; }
    .location { margin-top: 20px; color: #d3ddd8; font-size: 28px; }
    .middle { border-left: 4px solid #d8b47a; padding-left: 28px; }
    .price { color: #e3c696; font-size: 58px; font-weight: 800; }
    .details { margin-top: 18px; font-size: 24px; color: #f1f5f9; }
    .description { max-width: 800px; margin-top: 18px; font-size: 22px; line-height: 1.5; color: #cbd5e1; }
    .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
    .agency { font-size: 20px; line-height: 1.6; color: #cbd5e1; }
    .agency strong { display: block; color: white; font-size: 25px; }
    .phone { padding: 17px 22px; border-radius: 12px; background: #d8b47a; color: #102b2b; font-size: 23px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="poster">
    <header class="top">
      <p class="eyebrow">{{type_bien}}</p>
      <h1>{{titre}}</h1>
      <p class="location">{{localisation}}</p>
    </header>
    <section class="middle">
      <p class="price">{{prix}} {{devise}}</p>
      <p class="details">{{surface}} &nbsp;|&nbsp; {{details}}</p>
      <p class="description">{{description}}</p>
    </section>
    <footer class="bottom">
      <p class="agency"><strong>{{nom_agence}}</strong>Votre prochain projet commence ici.</p>
      <p class="phone">{{telephone}}</p>
    </footer>
  </main>
</body>
</html>
