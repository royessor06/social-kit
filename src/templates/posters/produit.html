<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    
    /* Configuration de base du poster */
    .poster {
      width: 1080px; 
      height: 1080px;
      background: #0f172a; 
      color: #ffffff; /* On force le texte en blanc */
      display: flex; 
      flex-direction: column;
      padding: 80px; 
      position: relative; 
      overflow: hidden;
      --accent: {{couleur_accent}}; /* La variable de couleur */
    }

    /* Logo (s'il est uploadé) */
    .logo-container:empty {
      display: none;
    }

    /* En-tête */
    .header { 
      position: relative; 
      z-index: 1; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      margin-bottom: 60px;
      gap: 24px;
    }
    .brand-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-container {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05); /* Fond très léger pour le contraste */
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .logo-container img,
    .logo-container .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* L'image remplit sans être déformée */
      display: block;
    }

    .brand { 
      font-size: 32px; 
      font-weight: 700; 
      letter-spacing: 2px; 
      color: var(--accent); 
      line-height: 1.1;
    }
    
    .badge { 
      padding: 8px 20px; 
      border-radius: 999px; 
      background: var(--accent); 
      color: #0f172a; /* Texte sombre sur fond clair */
      font-weight: 800; 
      font-size: 18px; 
    }

    /* Corps (Produit) */
    .center { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      position: relative; 
      z-index: 1; 
    }
    .product-name { 
      font-size: 100px; 
      font-weight: 900; 
      line-height: 1; 
      letter-spacing: -3px; 
      color: #ffffff; /* Titre en blanc */
    }
    .product-desc { 
      font-size: 32px; 
      color: #94a3b8; 
      margin-top: 32px; 
      max-width: 800px; 
      line-height: 1.4; 
    }
    
    /* Prix */
    .price-block { 
      margin-top: 80px; 
      display: flex; 
      align-items: baseline; 
      gap: 24px; 
    }
    .price { 
      font-size: 120px; 
      font-weight: 900; 
      color: var(--accent); 
      line-height: 1; 
    }
    .price-label { 
      font-size: 28px; 
      color: #94a3b8; 
      font-weight: 600;
      text-transform: uppercase;
    }
    .old-price { 
      font-size: 40px; 
      text-decoration: line-through; 
      color: #64748b; 
    }

    /* Pied de page */
    .footer {
      position: relative; 
      z-index: 1; 
      display: flex; 
      justify-content: space-between;
      padding-top: 32px; 
      border-top: 2px solid #1e293b; 
      font-size: 24px; 
      color: #94a3b8;
      margin-top: auto; /* Pousse le footer tout en bas */
    }
  </style>
</head>
<body>
  <div class="poster">

    <div class="header">
      <div class="brand-info">
        <div class="logo-container">{{logo}}</div>
        <div class="brand">{{nom_entreprise}}</div>
      </div>
      
      <div class="badge">{{badge}}</div>
    </div>

    <div class="center">
      <div class="product-name">{{nom_produit}}</div>
      <p class="product-desc">{{description}}</p>
      
      <div class="price-block">
        <span class="price">{{prix}}</span>
        <span class="price-label">{{devise}}</span>
        <span class="old-price">{{ancien_prix}}</span>
      </div>
    </div>

    <div class="footer">
      <div>{{telephone}}</div>
      <div>{{adresse}}</div>
    </div>
  </div>
</body>
</html>
