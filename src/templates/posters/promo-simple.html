<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    .accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 400px;
      height: 400px;
      background: #10b981;
      border-radius: 0 0 0 100%;
      opacity: 0.15;
    }
    .header {
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #0f172a;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 24px;
      border-radius: 999px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .business-name {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 32px;
    }
    .slogan {
      font-size: 28px;
      color: #94a3b8;
      margin-top: 16px;
      max-width: 700px;
      line-height: 1.4;
    }
    .body {
      position: relative;
      z-index: 1;
    }
    .promo-label {
      font-size: 20px;
      color: #10b981;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .promo-text {
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
    }
    .promo-detail {
      font-size: 32px;
      color: #cbd5e1;
      margin-top: 16px;
      max-width: 800px;
      line-height: 1.4;
    }
    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .contact {
      font-size: 22px;
      color: #94a3b8;
      line-height: 1.8;
    }
    .contact strong {
      color: #ffffff;
    }
    .address {
      font-size: 20px;
      color: #64748b;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="accent"></div>

    <div class="header">
      <span class="badge">{{badge}}</span>
      <h1 class="business-name">{{nom_entreprise}}</h1>
      <p class="slogan">{{slogan}}</p>
    </div>

    <div class="body">
      <p class="promo-label">{{promo_label}}</p>
      <p class="promo-text">{{promo_texte}}</p>
      <p class="promo-detail">{{promo_detail}}</p>
    </div>

    <div class="footer">
      <div class="contact">
        <strong>{{telephone}}</strong><br />
        WhatsApp : {{whatsapp}}
      </div>
      <div class="address">
        {{adresse}}
      </div>
    </div>
  </div>
</body>
</html>
