<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .poster {
      width: 1080px; height: 1080px;
      background: #7c3aed; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 90px; position: relative; overflow: hidden;
    }
    .circle-1 {
      position: absolute; top: -200px; right: -200px;
      width: 600px; height: 600px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .circle-2 {
      position: absolute; bottom: -150px; left: -150px;
      width: 400px; height: 400px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .header { position: relative; z-index: 1; }
    .event-type {
      display: inline-block; padding: 10px 28px; border-radius: 999px;
      background: #fbbf24; color: #7c3aed;
      font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    }
    .event-title {
      font-size: 96px; font-weight: 900; line-height: 1;
      margin-top: 40px; letter-spacing: -2px;
    }
    .event-subtitle { font-size: 32px; margin-top: 24px; opacity: 0.9; max-width: 800px; line-height: 1.3; }
    .body { position: relative; z-index: 1; }
    .date-block {
      display: inline-flex; align-items: center; gap: 32px;
      background: rgba(255,255,255,0.15); border-radius: 24px;
      padding: 32px 48px; backdrop-filter: blur(10px);
    }
    .date-day { font-size: 96px; font-weight: 900; line-height: 1; }
    .date-info { font-size: 24px; line-height: 1.4; }
    .date-info strong { font-size: 32px; display: block; }
    .footer {
      position: relative; z-index: 1;
      display: flex; justify-content: space-between; font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="header">
      <span class="event-type">{{type_evenement}}</span>
      <h1 class="event-title">{{titre_evenement}}</h1>
      <p class="event-subtitle">{{description}}</p>
    </div>
    <div class="body">
      <div class="date-block">
        <div class="date-day">{{jour}}</div>
        <div class="date-info">
          <strong>{{mois}}</strong>
          {{heure}}<br />{{lieu}}
        </div>
      </div>
    </div>
    <div class="footer">
      <div>{{organisateur}}</div>
      <div>{{telephone}}</div>
    </div>
  </div>
</body>
</html>
